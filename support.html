<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support | JStar Pro</title>
<meta name="description" content="Get help with JStar Pro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/legal/legal.css">
</head>
<body>
<header class="lg-top"><div class="lg-w"><a class="lg-logo" href="/software">JStar <span>Pro</span></a><nav><a href="/legal/terms">Terms</a><a href="/legal/privacy">Privacy</a><a href="/support" aria-current="page">Support</a></nav></div></header>
<main class="lg-w lg-doc">
<h1>Support</h1>
<p class="lg-date">Questions, billing, bugs, privacy or data requests. We reply by email, usually within one business day.</p>
<form class="card lg-sup" id="sup" autocomplete="on">
  <label class="f" for="name">Name</label>
  <input type="text" id="name" autocomplete="name" maxlength="80" required>
  <label class="f" for="email">Email</label>
  <input type="email" id="email" autocomplete="email" maxlength="120" required>
  <label class="f" for="topic">Topic</label>
  <select id="topic">
    <option>Question about the software</option>
    <option>Billing or my plan</option>
    <option>Something's broken</option>
    <option>Privacy or data request</option>
    <option>Homeowner: remove my information</option>
    <option>Other</option>
  </select>
  <label class="f" for="msg">Message</label>
  <textarea id="msg" maxlength="4000" required></textarea>
  <input class="hp" type="text" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="err" id="err" role="alert"></div>
  <p style="margin:16px 0 0"><button class="btn" id="go" type="submit">Send message</button></p>
</form>
<div class="card lg-sup" id="done" hidden><h2 style="margin-top:0">Got it.</h2><p class="note" style="font-size:15px">Your message is in. We'll reply to the email you gave.</p></div>
</main>
<footer class="lg-foot"><div class="lg-w">&copy; <span id="yr"></span> JStar Pro · <a href="/legal/terms">Terms</a> · <a href="/legal/privacy">Privacy</a> · <a href="/support">Support</a></div></footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  $('yr').textContent = new Date().getFullYear();
  fetch('/api/auth?action=me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(j => {
    if (j?.user) { if (!$('name').value) $('name').value = j.user.name || ''; if (!$('email').value) $('email').value = j.user.email || ''; }
  }).catch(() => {});
  $('sup').addEventListener('submit', async e => {
    e.preventDefault(); $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Sending…';
    try {
      const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'support', name: $('name').value, email: $('email').value, topic: $('topic').value, message: $('msg').value, web: $('web').value, page: document.referrer }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Could not send. Try again.');
      $('sup').hidden = true; $('done').hidden = false;
    } catch (err) { $('err').textContent = err.message; $('go').disabled = false; $('go').textContent = 'Send message'; }
  });
})();
</script>
</body>
</html>
