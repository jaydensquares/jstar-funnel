<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contract | JStar Acquisitions</title>
<style>
  :root { --ink:#111; --muted:#555; --line:#bbb; --brand:#111111; --warn:#8a5a00; --warnbg:#fff6e0; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:#eeeeee; color:var(--ink); font:15px/1.5 Georgia, 'Times New Roman', serif; }
  .bar { position:sticky; top:0; z-index:5; background:#111111; color:#fff; font:600 14px/1.2 -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar a { color:#d2d2d2; text-decoration:none; }
  .bar .sp { flex:1; }
  .bar button { font:inherit; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; background:#c6a052; color:#111111; }
  .bar button.alt { background:transparent; color:#fff; border:1px solid #525252; }
  .note { max-width:820px; margin:14px auto 0; padding:12px 14px; background:var(--warnbg); color:var(--warn); border-radius:8px; font:14px/1.45 -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .page { max-width:820px; margin:14px auto 40px; background:#fff; padding:48px 56px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size:20px; text-align:center; letter-spacing:.04em; margin:0 0 4px; text-transform:uppercase; }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 22px; }
  h2 { font-size:15px; margin:18px 0 4px; }
  p { margin:6px 0; }
  .blank { display:inline-block; min-width:160px; border-bottom:1px solid var(--ink); }
  .box { border:2px solid var(--ink); padding:12px 14px; margin:18px 0; }
  .box h2 { margin-top:0; }
  .init { margin-top:10px; }
  .sig { display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; margin-top:30px; }
  .sig div { border-top:1px solid var(--ink); padding-top:4px; font-size:13px; min-height:52px; }
  .bar .tabs { display:flex; gap:4px; }
  .bar .tabs a { padding:8px 12px; border-radius:8px; color:#d2d2d2; }
  .bar .tabs a[aria-current=page] { background:#111111; color:#fff; }
  .jvf { max-width:820px; margin:14px auto 0; background:#fff; border-radius:8px; padding:14px 16px; font:14px/1.4 -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px 14px; }
  .jvf b { grid-column:1/-1; font-size:14px; }
  .jvf label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; color:#333; }
  .jvf input, .jvf select { font:15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; padding:8px 10px; border:1px solid #d2d2d2; border-radius:6px; }
  .jvf .wide { grid-column:1/-1; }
  .err { max-width:820px; margin:30px auto; font:16px -apple-system, sans-serif; color:#b42318; text-align:center; }
  @media (max-width:640px) { .page { padding:28px 20px; margin:10px 8px 30px; } .sig { grid-template-columns:1fr; } }
  @media print {
    body { background:#fff; font-size:11.5pt; }
    .bar, .note, .jvf { display:none !important; }
    .page { box-shadow:none; margin:0; padding:0; max-width:none; }
    @page { margin:0.75in; }
    h2 { break-after:avoid; }
    .box, .sig { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="bar">
  <a href="/underwriting" id="back">Back to deal</a>
  <span class="sp"></span>
  <nav class="tabs" id="tabs"><a data-d="psa" href="#">Purchase agreement</a><a data-d="assign" href="#">Assignment</a><a data-d="jv" href="#">JV agreement</a></nav>
  <button id="print" type="button">Print / Save PDF</button>
</div>
<div class="note" id="note">Template only. Have a Texas real estate attorney review this contract before you use it with a real seller or buyer. Fill in anything blank (legal description, names) before signing.</div>
<form class="jvf" id="jvf" hidden autocomplete="off">
  <b>JV details (saved on this device; not printed)</b>
  <label>Who holds the purchase contract?<select id="jHolder"><option value="me">My company</option><option value="partner">The JV partner</option></select></label>
  <label>Partner's role<select id="jRole"><option value="dispo">Brings the buyer (dispo)</option><option value="acq">Brought the deal (acquisitions)</option><option value="both">Shares acquisition and dispo</option></select></label>
  <label>Your share of net profit (%)<input id="jSplit" type="number" min="0" max="100" step="1" value="50"></label>
  <label>Partner name<input id="jName"></label>
  <label>Partner company (optional)<input id="jCo"></label>
  <label>Partner phone<input id="jPhone" type="tel"></label>
  <label>Partner email<input id="jEmail" type="email"></label>
  <label>Earnest money paid by<select id="jEm"><option value="holder">The contract holder</option><option value="partner">The other party</option><option value="split">Split by the profit share</option></select></label>
  <label class="wide">Extra terms (optional)<input id="jExtra" placeholder="Example: Partner covers up to $500 in buyer marketing, reimbursed off the top"></label>
</form>
<div class="err" id="err" hidden></div>
<div class="page" id="doc" hidden></div>

<script>
(() => {
  // Your business info on the contracts
  const BIZ = { company: 'JStar Acquisitions', signer: 'Jayden Squares', title: 'Owner', phone: '(832) 833-0125', email: '' };

  const qs = new URLSearchParams(location.search);
  const id = qs.get('id'), docType = ['assign', 'jv'].includes(qs.get('doc')) ? qs.get('doc') : 'psa', blank = qs.get('blank') === '1' && docType === 'jv';
  const $ = s => document.getElementById(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => (n || n === 0) ? '$' + Number(n).toLocaleString() : '<span class="blank"></span>';
  const v = (x, w = 160) => x ? `<b>${esc(x)}</b>` : `<span class="blank" style="min-width:${w}px"></span>`;
  const date = s => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
  const words = n => { // number to words for the price line
    if (!n && n !== 0) return '';
    const a = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const t = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const h = x => (x >= 100 ? a[Math.floor(x / 100)] + ' hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 < 20 ? a[x % 100] : t[Math.floor(x % 100 / 10)] + (x % 10 ? '-' + a[x % 10] : ''));
    n = Math.round(n); if (n === 0) return 'zero';
    const parts = []; [[1e6, 'million'], [1e3, 'thousand'], [1, '']].forEach(([d, w]) => { const q = Math.floor(n / d); n %= d; if (q) parts.push(h(q) + (w ? ' ' + w : '')); });
    const s = parts.join(' ').trim(); return s.charAt(0).toUpperCase() + s.slice(1) + ' dollars';
  };

  $('back').href = '/underwriting#' + (id || '');
  document.querySelectorAll('#tabs a').forEach(a => { const q = new URLSearchParams(qs); q.set('doc', a.dataset.d); q.delete('blank'); a.href = '?' + q.toString(); if (a.dataset.d === docType) a.setAttribute('aria-current', 'page'); if (blank) a.hidden = a.dataset.d !== 'jv'; });
  $('print').onclick = () => window.print();

  let pin = ''; try { pin = sessionStorage.getItem('opPin') || ''; } catch {}
  const fail = m => { $('err').hidden = false; $('err').innerHTML = m; };
  if (blank) { $('back').hidden = true; render({}); return; }
  if (!id) return fail('No deal selected. <a href="/underwriting">Pick a deal</a>');

  fetch('/api/deals', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin, action: 'get', id }) })
    .then(async r => ({ ok: r.ok, j: await r.json().catch(() => ({})) }))
    .then(({ ok, j }) => { if (!ok) return fail(esc(j.error || 'Could not load the deal.') + ' <a href="/underwriting">Back to deals</a>'); if (j.biz) Object.assign(BIZ, j.biz); render(j.deal); })
    .catch(() => fail('Network error. Refresh to try again.'));

  function render(d) {
    const a = d.address || {}, s = d.seller || {}, b = d.buyer || {}, n = d.numbers || {}, t = d.terms || {}, tc = d.title || {};
    const addr = [a.street, a.city, a.state && (a.state + ' ' + (a.zip || ''))].filter(Boolean).join(', ');
    const sellers = [s.name, s.name2].filter(Boolean).join(' and ');
    const titleCo = [tc.company, tc.officer && `Attn: ${tc.officer}`, tc.phone, tc.email].filter(Boolean).join(' · ');
    const optDays = t.optionDays || 10, emDays = t.emDays || 3;
    document.title = ({ psa: 'Purchase Agreement', assign: 'Assignment', jv: 'JV Agreement' })[docType] + ' – ' + (a.street || 'Deal');
    const preTitle = a.street ? `<p class="sub">${esc(addr)}</p>` : '';

    const psa = `
      <h1>Real Estate Purchase and Sale Agreement</h1>${preTitle}
      <p>This Agreement is made on ${v(date(t.contractDate))} (the "Effective Date", which is the date the last party signs) between:</p>
      <p><b>Seller:</b> ${v(sellers, 260)}${s.mailing ? `, of ${esc(s.mailing)}` : ''}</p>
      <p><b>Buyer:</b> <b>${esc(BIZ.company)} and/or assigns</b></p>

      <h2>1. Property</h2>
      <p>The land, improvements and fixtures located at ${v(addr, 300)}, in ${v(a.county ? a.county + ' County' : '', 140)}, Texas, legally described as ${v(a.legal, 300)} (or as described in the title commitment), together with all rights and appurtenances (the "Property").</p>

      <h2>2. Purchase Price</h2>
      <p>The purchase price is ${money(n.contractPrice)}${n.contractPrice ? ` (${esc(words(n.contractPrice))})` : ''}, payable in cash or certified funds at closing. This Agreement is not contingent on Buyer obtaining financing.</p>

      <h2>3. Earnest Money</h2>
      <p>Within ${esc(emDays)} business days after the Effective Date, Buyer will deposit ${money(n.earnest)} as earnest money with ${v(tc.company, 220)} ("Title Company"). The earnest money will be applied to the purchase price at closing.</p>

      <h2>4. Inspection Period</h2>
      <p>Buyer has ${esc(optDays)} days after the Effective Date (the "Inspection Period") to inspect the Property and to evaluate it for Buyer's purposes. Buyer may terminate this Agreement for any reason by written notice to Seller before the Inspection Period ends, and the earnest money will be refunded to Buyer. Seller will give Buyer, its contractors, lenders and prospective assignees reasonable access to the Property on reasonable notice.</p>

      <h2>5. Condition of Property</h2>
      <p>Buyer accepts the Property in its present "AS IS, WHERE IS" condition, with all faults. Seller is not required to make any repairs. Seller will disclose any known material defects and will deliver any disclosures required by law, including a Seller's Disclosure Notice under Texas Property Code §5.008 if required, and the federal lead-based paint disclosure for homes built before 1978.</p>

      <h2>6. Title</h2>
      <p>Seller will convey good and marketable title by General Warranty Deed, free of all liens, judgments and encumbrances except those Buyer accepts in writing. Within the Inspection Period Buyer may obtain a title commitment. If title is not acceptable to Buyer, Buyer may terminate and receive a refund of the earnest money. Seller will cooperate with the Title Company to cure title issues, including payoff of all mortgages and liens from Seller's proceeds at closing.</p>

      <h2>7. Closing</h2>
      <p>Closing will take place at the Title Company on or before ${v(date(t.closingDate), 180)}, or sooner by mutual agreement. ${esc(t.possession || 'Seller will deliver possession of the Property to Buyer at closing, free of personal property and debris unless otherwise agreed.')}</p>

      <h2>8. Closing Costs and Prorations</h2>
      <p>Buyer will pay the customary closing costs, including the owner's title policy premium and escrow fees. Seller will pay the payoff of Seller's loans and liens, any of Seller's own attorney fees, and Seller's share of prorations. Property taxes, rents, security deposits and HOA dues (if any) will be prorated as of the closing date.</p>

      <h2>9. Assignment</h2>
      <p>Buyer may assign this Agreement, in whole or in part, without Seller's consent. On assignment, the assignee will assume Buyer's obligations under this Agreement. Seller agrees to close with Buyer or Buyer's assignee on the terms of this Agreement.</p>

      <h2>10. Default</h2>
      <p>If Buyer fails to close for a reason other than Seller's default or a failed condition in this Agreement, Seller's sole remedy is to keep the earnest money as liquidated damages. If Seller fails to close, Buyer may enforce specific performance or terminate and receive a refund of the earnest money, in addition to any other remedy available at law.</p>

      <h2>11. General</h2>
      <p>This Agreement is governed by Texas law and is the entire agreement between the parties. It may be signed in counterparts and with electronic signatures, which are binding. Time is of the essence. Any change must be in writing and signed by both parties.</p>
      ${t.extra ? `<h2>12. Additional Terms</h2><p>${esc(t.extra).replace(/\n/g, '<br>')}</p>` : ''}

      <div class="box">
        <h2>Notice to Seller (Texas Property Code §5.0205 and Occupations Code §1101.0045)</h2>
        <p>Buyer intends to assign its interest in this Agreement to another buyer, and may receive a fee or profit from doing so. Buyer may also choose to close on the purchase itself. Buyer is acquiring an equitable interest in the Property through this Agreement. Buyer is <b>not</b> a licensed real estate broker or sales agent and does not represent Seller. Seller is encouraged to consult an attorney before signing.</p>
        <p class="init">Seller's initials: ________ &nbsp; ________</p>
      </div>

      <div class="sig">
        <div>Seller signature<br><br>${esc(s.name || '')}</div><div>Date</div>
        ${s.name2 ? `<div>Seller signature<br><br>${esc(s.name2)}</div><div>Date</div>` : ''}
        <div>Buyer: ${esc(BIZ.company)} and/or assigns<br><br>By: ${esc(BIZ.signer)}, ${esc(BIZ.title)}</div><div>Date</div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:22px">Title Company: ${titleCo ? esc(titleCo) : '________________________'} · Buyer contact: ${esc(BIZ.phone)}${BIZ.email ? ' · ' + esc(BIZ.email) : ''}${s.phone ? ` · Seller phone: ${esc(s.phone)}` : ''}</p>`;

    const buyerName = b.entity || b.name;
    const assign = `
      <h1>Assignment of Real Estate Purchase Agreement</h1>${preTitle}
      <p>This Assignment is made on ${v(date(t.assignDate))} between <b>${esc(BIZ.company)}</b> ("Assignor") and ${v(buyerName, 260)}${b.entity && b.name ? `, by ${esc(b.name)}` : ''} ("Assignee").</p>

      <h2>1. The Contract</h2>
      <p>Assignor is the buyer under a Real Estate Purchase and Sale Agreement dated ${v(date(t.contractDate))} (the "Contract") with ${v(sellers, 220)} ("Seller") for the property at ${v(addr, 300)} (the "Property"), at a purchase price of ${money(n.contractPrice)}, with closing on or before ${v(date(t.closingDate), 180)} at ${v(tc.company, 200)} ("Title Company").</p>

      <h2>2. Assignment</h2>
      <p>Assignor assigns to Assignee all of Assignor's rights, title and interest in and to the Contract. Assignee accepts this assignment.</p>

      <h2>3. Assignment Fee</h2>
      <p>Assignee will pay Assignor an assignment fee of ${money(n.assignmentFee)}${n.assignmentFee ? ` (${esc(words(n.assignmentFee))})` : ''}. The fee will be paid at closing through the Title Company and shown on the settlement statement. If closing does not occur because of Assignee's default, the fee is still earned.</p>

      <h2>4. Non-Refundable Deposit</h2>
      <p>Within ${esc(t.buyerDepositDays || 2)} business days after signing, Assignee will deposit ${money(n.buyerDeposit)} with the Title Company. The deposit is non-refundable to Assignee, except if closing fails because of Seller's default, a title defect that cannot be cured, or Assignor's default. At closing the deposit will be credited to Assignee.</p>

      <h2>5. Assumption of Obligations</h2>
      <p>Assignee assumes and agrees to perform all of the buyer's obligations under the Contract, including paying the purchase price and closing costs and closing on or before the closing date. Assignee has received a copy of the Contract.</p>

      <h2>6. As-Is; Assignee's Own Due Diligence</h2>
      <p>Assignee is buying the Property "AS IS". Any after-repair value, comparable sales, repair estimates, rent figures or other numbers provided by Assignor are estimates only, not guarantees. Assignee has relied on its own inspection, research and judgment. Assignor makes no warranty about the Property's condition, value, title, zoning or fitness for any purpose.</p>

      <h2>7. General</h2>
      <p>This Assignment is governed by Texas law and binds the parties and their successors. It may be signed in counterparts and with electronic signatures.</p>

      <div class="box">
        <h2>Disclosure to Assignee (Texas Occupations Code §1101.0045 and Property Code §5.0205)</h2>
        <p>Assignor holds only an <b>equitable interest</b> in the Property under the Contract. Assignor does <b>not</b> own the Property or hold legal title, and is not selling the Property itself. Assignor is only assigning its interest in the Contract. Assignor is not a licensed real estate broker or sales agent and does not represent Assignee.</p>
        <p class="init">Assignee's initials: ________</p>
      </div>

      <div class="sig">
        <div>Assignor: ${esc(BIZ.company)}<br><br>By: ${esc(BIZ.signer)}, ${esc(BIZ.title)}</div><div>Date</div>
        <div>Assignee: ${esc(buyerName || '')}<br><br>${b.entity && b.name ? 'By: ' + esc(b.name) : ''}</div><div>Date</div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:22px">Title Company: ${titleCo ? esc(titleCo) : '________________________'} · Assignor: ${esc(BIZ.phone)}${b.phone ? ` · Assignee: ${esc(b.phone)}` : ''}${b.email ? ' · ' + esc(b.email) : ''}</p>`;

    if (docType === 'jv') return jv(d, { a, s, n, t, tc, addr, sellers, titleCo });
    $('doc').innerHTML = docType === 'psa' ? psa : assign;
    $('doc').hidden = false;
  }

  // ── Joint venture agreement for one wholesale deal ──
  function jv(d, { a, s, n, t, tc, addr, sellers }) {
    const F = ['jHolder', 'jRole', 'jSplit', 'jName', 'jCo', 'jPhone', 'jEmail', 'jEm', 'jExtra'], key = 'jv:' + (id || 'blank');
    try { const sv = JSON.parse(localStorage.getItem(key) || 'null'); if (sv) F.forEach(f => { if (sv[f] != null) $(f).value = sv[f]; }); } catch {}
    $('jvf').hidden = blank; if (blank) { $('note').textContent = 'Blank JV agreement. Template only: have a Texas real estate attorney review it before you use it.'; }
    const draw = () => {
      const g = Object.fromEntries(F.map(f => [f, $(f).value.trim()]));
      try { localStorage.setItem(key, JSON.stringify(g)); } catch {}
      const mine = blank ? null : Math.max(0, Math.min(100, Math.round(Number(g.jSplit) || 0))), theirs = mine == null ? null : 100 - mine;
      const pct = x => x == null ? '<span class="blank" style="min-width:50px"></span>%' : `<b>${x}%</b>`;
      const me = blank ? null : BIZ.company, partner = blank ? '' : (g.jCo ? `${g.jCo}${g.jName ? ', by ' + g.jName : ''}` : g.jName);
      const holderIsMe = g.jHolder !== 'partner';
      const A = blank ? '<span class="blank" style="min-width:240px"></span>' : `<b>${esc(holderIsMe ? me : partner || '')}</b>${!holderIsMe && !partner ? '<span class="blank" style="min-width:240px"></span>' : ''}`;
      const B = blank ? '<span class="blank" style="min-width:240px"></span>' : (holderIsMe ? (partner ? `<b>${esc(partner)}</b>` : '<span class="blank" style="min-width:240px"></span>') : `<b>${esc(me)}</b>`);
      const shareA = holderIsMe ? mine : theirs, shareB = holderIsMe ? theirs : mine;
      const roleB = { dispo: 'finding and bringing a qualified cash buyer (end buyer) for the Property and coordinating that buyer through closing', acq: 'having located the Property and the seller and brought the deal to the Contract Holder', both: 'sharing acquisition and disposition work as described in Section 3' }[blank ? 'both' : g.jRole];
      const em = blank ? 'the party named here: <span class="blank" style="min-width:200px"></span>' : { holder: 'the Contract Holder', partner: 'the JV Partner', split: 'both parties, in the same percentages as the profit split' }[g.jEm];
      const sigName = (who) => who === 'me' ? `${esc(BIZ.company)}<br><br>By: ${esc(BIZ.signer)}, ${esc(BIZ.title)}` : (blank ? '<br><br>By:' : `${esc(g.jCo || g.jName || '')}<br><br>${g.jCo && g.jName ? 'By: ' + esc(g.jName) : ''}`);
      $('doc').innerHTML = `
      <h1>Joint Venture Agreement</h1><p class="sub">Single-property wholesale transaction${addr ? ' · ' + esc(addr) : ''}</p>
      <p>This Joint Venture Agreement (the "Agreement") is effective on the date the last Party signs, between ${A} (the "Contract Holder") and ${B} (the "JV Partner"). Each is a "Party" and together the "Parties".</p>

      <h2>1. Purpose</h2>
      <p>The Parties are working together on one transaction only: the sale or assignment of the purchase contract for the property at ${v(addr, 300)} (the "Property"). This Agreement does not create a general partnership, employment relationship or any obligation beyond this one transaction. Neither Party may sign for or bind the other except as written here.</p>

      <h2>2. The Contract</h2>
      <p>The Contract Holder is the buyer under a Real Estate Purchase and Sale Agreement dated ${v(date(t.contractDate), 160)} with ${v(sellers, 220)} (the "Seller") for a purchase price of ${money(n.contractPrice)}, scheduled to close on or before ${v(date(t.closingDate), 160)} at ${v(tc.company, 200)} (the "Title Company") (the "Contract"). The Contract Holder will give the JV Partner a copy of the Contract on request and will keep the Contract in good standing, including meeting its deadlines and communicating with the Seller.</p>

      <h2>3. Roles</h2>
      <p><b>Contract Holder</b> will: keep control of the Contract; handle all communication with the Seller; arrange access to the Property for showings and inspections; and sign the assignment or closing documents.</p>
      <p><b>JV Partner</b> is contributing by ${roleB}. The JV Partner will not contact the Seller directly unless the Contract Holder approves in writing, and will not change, extend or cancel the Contract.</p>
      <p>Any buyer either Party brings must be approved by the Contract Holder before an assignment is signed, and must place a non-refundable deposit with the Title Company as the Contract Holder requires.</p>

      <h2>4. Earnest Money and Expenses</h2>
      <p>The earnest money under the Contract (${money(n.earnest)}) is paid by ${em}. Each Party pays its own marketing, travel and overhead unless both Parties approve an expense in writing (text or email is enough) before it is spent. At closing, the earnest money (if not credited to the end buyer) and any approved expenses are repaid to whoever paid them before profits are split.</p>

      <h2>5. Profit Split</h2>
      <p>"Net Profit" means the assignment fee or the difference between the end buyer's price and the Contract price (expected about ${money(n.assignmentFee)}), minus the repayments in Section 4. The Parties split Net Profit as follows: Contract Holder ${pct(shareA)} and JV Partner ${pct(shareB)}.</p>
      <p>Both shares are paid by the Title Company at closing, through the settlement statement or written disbursement instructions signed by both Parties. Neither Party will accept any payment for this transaction outside of closing. If the deal closes through a double close instead of an assignment, the same split applies to the spread after the costs of the second closing.</p>

      <h2>6. Marketing and Legal Compliance</h2>
      <p>The Parties act only as principals with an equitable interest in the Contract, not as real estate brokers or agents for the Seller or any buyer. Any marketing of the deal must be approved by the Contract Holder, must not be posted on the MLS, and must clearly say that what is being offered is an assignment of a purchase contract (an equitable interest), not legal title to the Property, as required by Texas Occupations Code §1101.0045. Each Party will follow all laws that apply to it, including Texas Property Code §5.0205 disclosures, fair housing laws, and telemarketing and texting rules.</p>

      <h2>7. Non-Circumvention</h2>
      <p>For 12 months after signing, neither Party will go around the other to buy, sell or assign the Property, or to deal directly with the Seller or the end buyer on this Property, without paying the other Party its full share under Section 5.</p>

      <h2>8. Confidentiality</h2>
      <p>The Parties will keep the Contract terms, the Seller's information and the buyer's information confidential and will use them only for this transaction.</p>

      <h2>9. Term and Termination</h2>
      <p>This Agreement ends when the Net Profit is paid at closing, or if the Contract ends without closing. If the Contract ends without closing, each Party bears its own costs, and any refunded earnest money goes back to whoever paid it. Sections 7 and 8 survive.</p>

      <h2>10. Independent Parties, Taxes and Liability</h2>
      <p>Each Party is an independent business, responsible for its own taxes, licenses and insurance, and will receive its own tax reporting from the Title Company where applicable. Each Party is responsible for its own acts and will indemnify the other for claims caused by its own breach, negligence or violation of law.</p>

      <h2>11. Disputes</h2>
      <p>This Agreement is governed by Texas law. The Parties will first try in good faith to resolve any dispute by talking, then by mediation in ${v(a.county ? a.county + ' County' : '', 140)}, Texas, before filing suit there. The winning Party in any lawsuit may recover reasonable attorney's fees.</p>

      <h2>12. General</h2>
      <p>This is the entire agreement between the Parties about this transaction. Changes must be in writing and signed (electronic signatures and counterparts are fine). If any part is unenforceable, the rest still applies.</p>
