<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up | JStar Pro</title>
<meta name="description" content="Seller lead funnels, instant cash-offer analysis, underwriting and contracts for real estate wholesalers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .acct-only { display:none !important; } body.acct .acct-only { display:inline !important; } body.acct .owner-only { display:none !important; }

  .authwrap { max-width:440px; margin:0 auto; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:14px; }
  .tabs button { border:0; background:transparent; color:var(--muted); font:700 15px var(--body); padding:10px; border-radius:9px; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .hint { font-size:12.5px; color:var(--muted); margin-top:5px; }
  .pfx { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; background:var(--input); overflow:hidden; }
  .pfx span { padding:0 0 0 12px; color:var(--muted); font-size:14px; white-space:nowrap; }
  .pfx input { border:0 !important; box-shadow:none !important; padding-left:2px; }
  .planpick { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:6px; display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:14.5px; }
  .planpick b { font-family:var(--display); font-size:16px; }
  .planpick a { color:var(--brand); font-weight:600; text-decoration:none; font-size:14px; }
  .planpick { display:block !important; }
  .ppick select { width:100%; margin-top:8px; }
  .seg2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .seg2 button { border:0; background:none; font:600 14px var(--body); color:var(--muted); padding:8px; border-radius:7px; cursor:pointer; }
  .seg2 button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(16,24,40,.1); }
  .seg2 em { font-style:normal; font-size:11.5px; font-weight:700; color:#067647; background:#ecfdf3; padding:2px 6px; border-radius:999px; margin-left:4px; }
</style>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header><div class="wrap"><a class="logo" href="/software">JStar <span>Pro</span></a><nav class="nav"><a href="/software#pricing">Pricing</a></nav></div></header>
<main class="wrap authwrap">
  <section class="card">
    <div class="tabs" role="tablist">
      <button type="button" id="tLogin" role="tab">Log in</button>
      <button type="button" id="tSignup" role="tab">Sign up</button>
    </div>

    <form id="login" autocomplete="on">
      <label class="f" for="lEmail">Email</label>
      <input type="text" id="lEmail" inputmode="email" autocomplete="email" required>
      <label class="f" for="lPass">Password</label>
      <input type="password" id="lPass" autocomplete="current-password" required>
      <div class="err" id="lErr" role="alert"></div>
      <button class="btn" id="lBtn" type="submit">Log in</button>
      <p style="text-align:center;margin:14px 0 0"><button type="button" class="link" id="forgotLink">Forgot password?</button></p>
    </form>

    <form id="forgot" hidden autocomplete="on">
      <p class="sub" style="margin:0 0 6px">Enter your account email and we'll send you a link to choose a new password.</p>
      <label class="f" for="fEmail">Email</label>
      <input type="text" id="fEmail" inputmode="email" autocomplete="email" required>
      <div class="err" id="fErr" role="alert"></div>
      <button class="btn" id="fBtn" type="submit">Send reset link</button>
      <p style="text-align:center;margin:14px 0 0"><button type="button" class="link" id="backLogin">Back to log in</button></p>
    </form>

    <form id="signup" hidden autocomplete="on">
      <div class="planpick" id="planPick" hidden></div>
      <div class="row">
        <div><label class="f" for="sName">Your name</label><input type="text" id="sName" autocomplete="name" required></div>
        <div><label class="f" for="sPhone">Business phone</label><input type="tel" id="sPhone" autocomplete="tel" inputmode="tel" required></div>
      </div>
      <label class="f" for="sCompany">Business name</label>
      <input type="text" id="sCompany" placeholder="e.g. Lone Star Home Buyers" autocomplete="organization" required>
      <div class="hint">Shows on your seller funnel and contracts.</div>
      <label class="f" for="sUser">Username</label>
      <div class="pfx"><span id="pfx"></span><input type="text" id="sUser" autocapitalize="none" autocomplete="username" spellcheck="false" maxlength="30" required></div>
      <div class="hint">Your funnel link until you connect your own domain.</div>
      <label class="f" for="sEmail">Email</label>
      <input type="text" id="sEmail" inputmode="email" autocomplete="email" required>
      <label class="f" for="sPass">Password</label>
      <input type="password" id="sPass" autocomplete="new-password" minlength="8" required>
      <div class="hint">At least 8 characters.</div>
      <label class="check" style="align-items:flex-start"><input type="checkbox" id="sAgree" required style="margin-top:3px"><span>I agree to the <a href="/legal/terms" target="_blank">Terms of Service</a> and <a href="/legal/privacy" target="_blank">Privacy Policy</a>, and I'll follow the real estate and telemarketing laws in my state.</span></label>
      <div class="err" id="sErr" role="alert"></div>
      <button class="btn" id="sBtn" type="submit">Create account</button>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || ''; return /^\/[a-z0-9_./#-]*$/i.test(n) && !n.startsWith('//') ? n : '/app'; })();
  const mode = m => {
    $('login').hidden = m !== 'login'; $('signup').hidden = m !== 'signup'; $('forgot').hidden = true;
    $('tLogin').classList.toggle('on', m === 'login'); $('tSignup').classList.toggle('on', m === 'signup');
    document.title = (m === 'login' ? 'Log in' : 'Sign up') + ' | JStar Pro';
    (m === 'login' ? $('lEmail') : $('sName')).focus();
  };
  $('tLogin').onclick = () => { history.replaceState(null, '', '#login'); mode('login'); };
  $('tSignup').onclick = () => { history.replaceState(null, '', '#signup'); mode('signup'); };
  $('pfx').textContent = location.host + '/f/';
  const PLANS = { starter: ['Starter', 49], pro: ['Pro', 99], team: ['Team', 199] };
  const qs = new URLSearchParams(location.search);
  // Every account needs a plan; there's no free trial. Yearly = 10 months' price (2 months free).
  let plan = PLANS[qs.get('plan')] ? qs.get('plan') : 'pro', interval = qs.get('billing') === 'year' ? 'year' : 'month';
  // Referral: ?ref=<username>, remembered from the sales page too
  let ref = (qs.get('ref') || '').toLowerCase(); try { if (ref) localStorage.setItem('jsRef', ref); else ref = localStorage.getItem('jsRef') || ''; } catch {}
  if (!/^[a-z0-9-]{3,30}$/.test(ref)) ref = '';
  const drawPlan = () => {
    const [n, p] = PLANS[plan];
    $('planPick').innerHTML = `<div class="ppick"><div class="seg2"><button type="button" data-i="month" class="${interval === 'month' ? 'on' : ''}">Monthly</button><button type="button" data-i="year" class="${interval === 'year' ? 'on' : ''}">Yearly <em>2 months free</em></button></div>
      <select id="planSel" aria-label="Plan">${Object.entries(PLANS).map(([k, [nm, pr]]) => `<option value="${k}" ${k === plan ? 'selected' : ''}>${nm} · ${interval === 'year' ? '$' + (pr * 10).toLocaleString() + '/year' : '$' + pr + '/month'}</option>`).join('')}</select>
      <p class="hint" style="margin:6px 0 0">${interval === 'year' ? `$${(p * 10).toLocaleString()} billed yearly, about $${Math.round(p * 10 / 12)}/month. You save $${p * 2}.` : ref ? '<b>Referral applied:</b> 50% off your first month.' : 'Billed monthly. Cancel any time.'} <a href="/support?topic=agency">Agency plan? Book a call</a></p></div>`;
    $('planSel').onchange = e => { plan = e.target.value; drawPlan(); };
    $('planPick').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { interval = b.dataset.i; drawPlan(); });
  };
  $('planPick').hidden = false; drawPlan();
  $('sBtn').textContent = 'Create account and continue to payment';
  // Team invite: ?invite=<token> → join an existing account, no plan or payment
  const invite = /^[a-f0-9]{32}$/.test(qs.get('invite') || '') ? qs.get('invite') : null;
  if (invite) {
    $('planPick').hidden = true;
    ['sCompany', 'sUser', 'sPhone'].forEach(id => { const el = $(id); el.required = false; (el.closest('.pfx') || el).parentElement.querySelectorAll(`[for="${id}"]`).forEach(l => l.hidden = true); (el.closest('.pfx') || el).hidden = true; const h = (el.closest('.pfx') || el).nextElementSibling; if (h?.classList.contains('hint')) h.hidden = true; });
    $('sBtn').textContent = 'Join the team'; $('sName').closest('.row').style.gridTemplateColumns = '1fr';
    setTimeout(() => post({ action: 'inviteInfo', token: invite }).then(r => {
      if (!r.ok) { $('sErr').textContent = r.j.error; $('sBtn').disabled = true; return; }
      $('signup').insertAdjacentHTML('afterbegin', `<p class="banner" style="margin:0 0 14px"><b>${esc(r.j.owner)}</b> invited you to <b>${esc(r.j.company)}</b> on JStar Pro. Create your login below.</p>`);
      if (r.j.email) $('sEmail').value = r.j.email;
    }), 0);
  }
  mode(location.hash === '#signup' || location.pathname.includes('signup') || new URLSearchParams(location.search).get('plan') ? 'signup' : 'login');

  // Already logged in → straight to the app
  fetch('/api/auth?action=me').then(r => r.ok && location.replace(next)).catch(() => {});

  $('sCompany').addEventListener('input', () => {
    if ($('sUser').dataset.touched) return;
    $('sUser').value = $('sCompany').value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
  });
  $('sUser').addEventListener('input', () => { $('sUser').dataset.touched = 1; $('sUser').value = $('sUser').value.toLowerCase().replace(/[^a-z0-9-]/g, ''); });

  const post = body => fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async r => ({ ok: r.ok, j: await r.json().catch(() => ({})) })).catch(() => ({ ok: false, j: { error: 'Network error. Try again.' } }));

  $('forgotLink').onclick = () => { $('login').hidden = true; $('forgot').hidden = false; $('fEmail').value = $('lEmail').value; $('fEmail').focus(); };
  $('backLogin').onclick = () => { $('forgot').hidden = true; $('login').hidden = false; };
  $('forgot').addEventListener('submit', async e => {
    e.preventDefault(); $('fErr').textContent = ''; $('fBtn').disabled = true; $('fBtn').textContent = 'Sending…';
    const r = await post({ action: 'forgot', email: $('fEmail').value.trim() });
    $('fBtn').disabled = false; $('fBtn').textContent = 'Send reset link';
    if (!r.ok) { $('fErr').textContent = r.j.error || 'Could not send. Try again.'; return; }
    $('forgot').innerHTML = '<p style="margin:0;line-height:1.55"><b>Check your email.</b> If an account exists for that address, a reset link is on its way. It works for one hour.</p>';
  });
  $('login').addEventListener('submit', async e => {
    e.preventDefault(); $('lErr').textContent = ''; $('lBtn').disabled = true; $('lBtn').textContent = 'Logging in…';
    const r = await post({ action: 'login', email: $('lEmail').value.trim(), password: $('lPass').value });
    $('lBtn').disabled = false; $('lBtn').textContent = 'Log in';
    if (!r.ok) { $('lErr').textContent = r.j.error || 'Could not log in.'; return; }
    location.replace(next);
  });
  // Account first, then straight to Stripe Checkout. Nobody gets into the app without paying.
  let created = false;
  $('signup').addEventListener('submit', async e => {
    e.preventDefault(); $('sErr').textContent = ''; $('sBtn').disabled = true;
    if (invite) {
      $('sBtn').textContent = 'Joining…';
      const r = await post({ action: 'join', token: invite, name: $('sName').value.trim(), email: $('sEmail').value.trim(), password: $('sPass').value, agree: $('sAgree').checked });
      if (!r.ok) { $('sBtn').disabled = false; $('sBtn').textContent = 'Join the team'; $('sErr').textContent = r.j.error || 'Could not join.'; return; }
      location.replace('/app'); return;
    }
    if (!created) {
      $('sBtn').textContent = 'Creating your account…';
      const r = await post({ action: 'signup', name: $('sName').value.trim(), phone: $('sPhone').value.trim(), company: $('sCompany').value.trim(), username: $('sUser').value.trim(), email: $('sEmail').value.trim(), password: $('sPass').value, agree: $('sAgree').checked, ref });
      if (!r.ok) { $('sBtn').disabled = false; $('sBtn').textContent = 'Create account and continue to payment'; $('sErr').textContent = r.j.error || 'Could not sign up.'; return; }
      created = true;
      $('signup').querySelectorAll('input').forEach(i => { i.disabled = true; });
    }
    $('sBtn').textContent = 'Opening secure checkout…';
    const c = await fetch('/api/billing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'checkout', plan, interval }) }).then(x => x.json().catch(() => ({}))).catch(() => ({}));
    if (c.url) { location.href = c.url; return; }
    $('sBtn').disabled = false; $('sBtn').textContent = 'Try payment again';
    $('sErr').textContent = (c.error || 'Payment page couldn\'t open.') + ' Your account is saved; log in any time to finish paying.';
  });
})();
</script>
</body>
</html>
